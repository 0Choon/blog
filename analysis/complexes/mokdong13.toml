# ─────────────────────────────────────────────────────────────
# 재건축 사업성분석 입력 파일
# 예시: [사업성분석#21] 목동 13단지 (블로그 글 수치 그대로)
#
# 새 단지 분석: 이 파일을 복사해 이름만 바꾼 뒤(예: sanggye5.toml) 숫자를 고치고
#   python analysis/feasibility.py analysis/complexes/sanggye5.toml
#
# 금액 단위는 모두 '천원' (블로그 수지표와 동일), 면적은 ㎡, 단가는 천원/평
# ─────────────────────────────────────────────────────────────

[info]
series_no   = 21                              # 사업성분석 #번호
name        = "목동 13단지"
address     = "서울특별시 양천구 목동동로 100"
completion  = "1987. 7. 30."
age         = 40                              # 년차
households  = 2280
far         = 159                             # 현재 용적률(%)
size_range  = "21 ~ 58평형(공급평형)"
site_area_m2 = 162139.7                       # 대지면적
owners      = 2353                            # 토지등소유자 수
owners_note = "정비몽땅 게시 기준"
notice      = "서울특별시고시 제2025-122호"    # 정비구역 지정 고시
plan_far    = "획지1 - 299.94%, 획지2 - 299.98%"
construction_months = 48

# ── 기본 가정 (정비구역 결정고시 추정치) ──────────────────────
[base]
general_price           = 55000    # 일반분양가 (천원/평) = 5,500만원
member_price_ratio      = 0.863636 # 조합원분양가 = 일반분양가 × 비율 (4,750 / 5,500)
construction_per_pyeong = 8740     # 평당공사비 (천원/평) = 874만원
gfa_pyeong              = 242003.92  # 공사 연면적(평). 모르면 '공사비 ÷ 평당공사비'로 역산
appraisal_ratio         = 1.0      # 종전자산 감정평가액 = 추정시세 × 비율
public_amount           = 68178100 # 공공주택 매각대금 (직접 입력)
# public_amount 대신 아래 두 값을 넣으면 '공급면적(평) × 기본형건축비 × 비율'로 계산
# public_basic_cost = 7690         # 기본형건축비 (천원/평)
# public_ratio      = 0.8

